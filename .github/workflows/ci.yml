name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: dependent packages (the demo) typecheck against the lib's
      # emitted dist/*.d.ts, which doesn't exist until skeletonme is built.
      # pnpm -r builds in topological order, so the lib is ready before the demo.
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
